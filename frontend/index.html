<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Claude Code Notes RAG</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12/lib/marked.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f5f2;
    --panel: #ffffff;
    --text: #1c1917;
    --muted: #6b6560;
    --accent: #b45f4d;
    --accent-soft: #f1ddd6;
    --border: #e7e2dc;
    --code-bg: #efe9e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17140f;
      --panel: #221e18;
      --text: #f3ede4;
      --muted: #a89d8f;
      --accent: #e08a72;
      --accent-soft: #3a2a24;
      --border: #38322a;
      --code-bg: #2a251e;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
  }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
  }
  #app {
    width: 100%;
    max-width: 760px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 1.5rem 1rem 1rem;
  }
  header {
    flex: 0 0 auto;
    margin-bottom: 0.75rem;
  }
  h1 {
    font-size: 1.3rem;
    margin: 0 0 0.2rem;
  }
  p.subtitle {
    color: var(--muted);
    margin: 0;
    font-size: 0.85rem;
  }
  #chat {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 0.5rem 0.25rem;
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
  }
  .empty-hint {
    color: var(--muted);
    font-size: 0.9rem;
    margin: auto;
    text-align: center;
  }
  .row {
    display: flex;
  }
  .row.user { justify-content: flex-end; }
  .row.assistant { justify-content: flex-start; }

  .bubble {
    max-width: 88%;
    border-radius: 12px;
    padding: 0.7rem 1rem;
    line-height: 1.6;
    font-size: 0.95rem;
  }
  .bubble.user {
    background: var(--accent-soft);
    border: 1px solid var(--accent-soft);
  }
  .bubble.assistant {
    background: var(--panel);
    border: 1px solid var(--border);
  }
  .bubble.pending {
    color: var(--muted);
  }
  .bubble.error {
    color: #c0392b;
    border-color: #c0392b;
  }

  /* rendered markdown inside assistant bubbles */
  .markdown :first-child { margin-top: 0; }
  .markdown :last-child { margin-bottom: 0; }
  .markdown h1, .markdown h2, .markdown h3 {
    font-size: 1.05em;
    margin: 0.9em 0 0.4em;
  }
  .markdown p { margin: 0.5em 0; }
  .markdown ul, .markdown ol { margin: 0.4em 0; padding-left: 1.4em; }
  .markdown li { margin: 0.2em 0; }
  .markdown code {
    background: var(--code-bg);
    border-radius: 4px;
    padding: 0.1em 0.35em;
    font-size: 0.9em;
  }
  .markdown pre {
    background: var(--code-bg);
    border-radius: 8px;
    padding: 0.7em 0.9em;
    overflow-x: auto;
  }
  .markdown pre code {
    background: none;
    padding: 0;
  }
  .markdown table {
    border-collapse: collapse;
    width: 100%;
    font-size: 0.9em;
    margin: 0.5em 0;
  }
  .markdown th, .markdown td {
    border: 1px solid var(--border);
    padding: 0.35em 0.6em;
    text-align: left;
  }
  .markdown blockquote {
    margin: 0.5em 0;
    padding-left: 0.8em;
    border-left: 3px solid var(--border);
    color: var(--muted);
  }

  .sources {
    margin-top: 0.7rem;
    padding-top: 0.6rem;
    border-top: 1px solid var(--border);
    font-size: 0.8rem;
    color: var(--muted);
  }
  .sources a {
    color: var(--accent);
    text-decoration: none;
  }

  form {
    flex: 0 0 auto;
    display: flex;
    gap: 0.5rem;
    padding-top: 0.75rem;
  }
  input[type="text"] {
    flex: 1;
    padding: 0.7rem 0.9rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 1rem;
  }
  button {
    padding: 0.7rem 1.2rem;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.6;
    cursor: default;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Claude Code Notes RAG</h1>
    <p class="subtitle">問問「Claude Code in Action」9 篇筆記裡的任何東西，可以連續追問</p>
  </header>

  <div id="chat">
    <p class="empty-hint">還沒有對話，先問個問題試試看</p>
  </div>

  <form id="ask-form">
    <input id="question" type="text" placeholder="例如：Hooks 跟 CLAUDE.md 有什麼不同？" autofocus />
    <button id="submit-btn" type="submit">送出</button>
  </form>
</div>

<script>
  const API_BASE = "http://127.0.0.1:8000";
  const form = document.getElementById("ask-form");
  const input = document.getElementById("question");
  const submitBtn = document.getElementById("submit-btn");
  const chat = document.getElementById("chat");

  // messages: [{role: "user"|"assistant", content: string, sources?: [{title,url}]}]
  const messages = [];

  function renderMarkdown(text) {
    const html = marked.parse(text, { breaks: true, gfm: true });
    return DOMPurify.sanitize(html);
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function renderChat() {
    if (messages.length === 0) {
      chat.innerHTML = '<p class="empty-hint">還沒有對話，先問個問題試試看</p>';
      return;
    }

    chat.innerHTML = messages
      .map((m) => {
        if (m.role === "user") {
          return `
            <div class="row user">
              <div class="bubble user">${escapeHtml(m.content)}</div>
            </div>`;
        }

        if (m.pending) {
          return `
            <div class="row assistant">
              <div class="bubble assistant pending">思考中…</div>
            </div>`;
        }

        if (m.error) {
          return `
            <div class="row assistant">
              <div class="bubble assistant error">${escapeHtml(m.content)}</div>
            </div>`;
        }

        const sourcesHtml = (m.sources || [])
          .map(
            (s) =>
              `<div>${escapeHtml(s.title)}${s.url ? ` — <a href="${escapeHtml(s.url)}" target="_blank" rel="noopener">Notion 連結</a>` : ""}</div>`
          )
          .join("");

        return `
          <div class="row assistant">
            <div class="bubble assistant">
              <div class="markdown">${renderMarkdown(m.content)}</div>
              ${
                sourcesHtml
                  ? `<div class="sources"><strong>引用來源：</strong>${sourcesHtml}</div>`
                  : ""
              }
            </div>
          </div>`;
      })
      .join("");

    chat.scrollTop = chat.scrollHeight;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    // history sent to the backend excludes the pending turn we're about to add
    const history = messages
      .filter((m) => !m.pending && !m.error)
      .map((m) => ({ role: m.role, content: m.content }));

    messages.push({ role: "user", content: question });
    const pendingMessage = { role: "assistant", content: "", pending: true };
    messages.push(pendingMessage);
    input.value = "";
    submitBtn.disabled = true;
    renderChat();

    try {
      const res = await fetch(`${API_BASE}/ask`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, history }),
      });

      if (!res.ok) {
        throw new Error(`伺服器回傳 ${res.status}`);
      }

      const data = await res.json();
      pendingMessage.content = data.answer;
      pendingMessage.sources = data.sources;
      pendingMessage.pending = false;
    } catch (err) {
      pendingMessage.pending = false;
      pendingMessage.error = true;
      pendingMessage.content = `發生錯誤：${err.message}（確認後端是否已啟動：uvicorn backend.main:app --reload）`;
    } finally {
      submitBtn.disabled = false;
      renderChat();
      input.focus();
    }
  });

  renderChat();
</script>
</body>
</html>
