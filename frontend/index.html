<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Claude Code Notes RAG</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f5f2;
    --panel: #ffffff;
    --text: #1c1917;
    --muted: #6b6560;
    --accent: #b45f4d;
    --border: #e7e2dc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17140f;
      --panel: #221e18;
      --text: #f3ede4;
      --muted: #a89d8f;
      --accent: #e08a72;
      --border: #38322a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 2.5rem 1rem;
  }
  main {
    width: 100%;
    max-width: 720px;
  }
  h1 {
    font-size: 1.4rem;
    margin-bottom: 0.25rem;
  }
  p.subtitle {
    color: var(--muted);
    margin-top: 0;
    margin-bottom: 1.5rem;
    font-size: 0.9rem;
  }
  form {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
  }
  input[type="text"] {
    flex: 1;
    padding: 0.7rem 0.9rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 1rem;
  }
  button {
    padding: 0.7rem 1.2rem;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.6;
    cursor: default;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.2rem 1.4rem;
    margin-bottom: 1rem;
  }
  .answer {
    white-space: pre-wrap;
    line-height: 1.6;
  }
  .sources {
    margin-top: 1rem;
    padding-top: 0.8rem;
    border-top: 1px solid var(--border);
    font-size: 0.85rem;
    color: var(--muted);
  }
  .sources a {
    color: var(--accent);
    text-decoration: none;
  }
  .status {
    color: var(--muted);
    font-size: 0.9rem;
  }
  .error {
    color: #c0392b;
  }
</style>
</head>
<body>
<main>
  <h1>Claude Code Notes RAG</h1>
  <p class="subtitle">問問「Claude Code in Action」9 篇筆記裡的任何東西</p>

  <form id="ask-form">
    <input id="question" type="text" placeholder="例如：Hooks 跟 CLAUDE.md 有什麼不同？" autofocus />
    <button id="submit-btn" type="submit">提問</button>
  </form>

  <div id="result"></div>
</main>

<script>
  const API_BASE = "http://127.0.0.1:8000";
  const form = document.getElementById("ask-form");
  const input = document.getElementById("question");
  const submitBtn = document.getElementById("submit-btn");
  const result = document.getElementById("result");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    submitBtn.disabled = true;
    result.innerHTML = '<p class="status">思考中…</p>';

    try {
      const res = await fetch(`${API_BASE}/ask`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });

      if (!res.ok) {
        throw new Error(`伺服器回傳 ${res.status}`);
      }

      const data = await res.json();
      const sourcesHtml = data.sources
        .map(
          (s) =>
            `<div>${escapeHtml(s.title)}${s.url ? ` — <a href="${escapeHtml(s.url)}" target="_blank" rel="noopener">Notion 連結</a>` : ""}</div>`
        )
        .join("");

      result.innerHTML = `
        <div class="card">
          <div class="answer">${escapeHtml(data.answer)}</div>
          <div class="sources">
            <strong>引用來源：</strong>
            ${sourcesHtml || "（無）"}
          </div>
        </div>
      `;
    } catch (err) {
      result.innerHTML = `<p class="error">發生錯誤：${escapeHtml(err.message)}（確認後端是否已啟動：uvicorn backend.main:app --reload）</p>`;
    } finally {
      submitBtn.disabled = false;
    }
  });

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }
</script>
</body>
</html>
